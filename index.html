<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Tank Roguelite 3D</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Chakra+Petch:wght@400;500;600;700&display=swap">
<style>
[hidden]{display:none!important}
/* Layout: full-screen battlefield canvas; briefing + garage sit on a scrolling "field desk" overlay. Single dark look on purpose. */
:root{
  --bg:#1a1e16; --panel:#232a1e; --panel2:#2d3527; --line:#414b36; --fg:#ebe8d5; --muted:#a2a48c;
  --accent:#e2b548; --enemy:#d4613f; --good:#93c46b; --ink:#14170f;
  --display:'Black Ops One', Impact, 'Arial Black', system-ui, sans-serif;
  --ui:'Chakra Petch', 'Segoe UI', system-ui, sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--ui);overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;display:grid;place-items:center}
#phone{position:fixed;inset:0;overflow:hidden;background:var(--bg)}
canvas#cv,canvas#gl{position:absolute;inset:0;width:100%;height:100%;display:block}
#ld{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);z-index:50;font:600 12px var(--ui);color:var(--muted);background:rgba(0,0,0,.55);padding:5px 10px;border-radius:6px;pointer-events:none}
button{font-family:var(--ui);cursor:pointer;color:var(--fg)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ---------- menu ---------- */
#menu{position:absolute;inset:0;overflow-y:auto;background:var(--bg);touch-action:pan-y;z-index:20}
.wrap{max-width:1080px;margin:0 auto;padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:22px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.brand{font-family:var(--display);font-size:clamp(26px,5vw,40px);letter-spacing:.02em;line-height:1;color:var(--fg)}
.brand small{display:block;font-family:var(--ui);font-size:13px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;margin-top:6px}
.gold{font-variant-numeric:tabular-nums;font-weight:700;font-size:18px;color:var(--accent);background:var(--panel);border:1px solid var(--line);padding:8px 14px;border-radius:6px}
.step{display:grid;gap:10px}
.step h2{margin:0;font-family:var(--display);font-weight:400;font-size:20px;letter-spacing:.03em;display:flex;gap:10px;align-items:baseline}
.step h2 span{font-family:var(--ui);font-size:12px;font-weight:600;color:var(--ink);background:var(--accent);padding:2px 7px;border-radius:3px}
.step p.hint{margin:0;color:var(--muted);font-size:14px;max-width:70ch}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.card{background:var(--panel);border:1.5px solid var(--line);border-radius:8px;padding:14px;text-align:left;display:grid;gap:10px;align-content:start;min-width:0}
.card.sel{border-color:var(--accent);background:var(--panel2);box-shadow:0 0 0 1px var(--accent) inset}
.card h3{margin:0;font-size:20px;font-weight:700;display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.card .sub{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.card .desc{font-size:14px;color:var(--fg);opacity:.9;margin:0}
.bars{display:grid;grid-template-columns:auto 1fr;gap:5px 10px;align-items:center;font-size:12px;color:var(--muted)}
.bar{height:8px;background:var(--bg);border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--muted)}
.bar i.hi{background:var(--enemy)}
.bar i.me{background:var(--good)}
.path{display:flex;align-items:center;gap:0;flex-wrap:wrap;row-gap:8px}
.node{background:var(--panel);border:1.5px solid var(--line);border-radius:8px;padding:8px 12px;display:grid;gap:1px;text-align:left;font-size:14px;min-width:0}
.node b{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.node small{font-size:12px;color:var(--muted)}
.node.sel{border-color:var(--accent);background:var(--panel2)}
.node[disabled]{opacity:.5;cursor:not-allowed}
.link{width:24px;height:2px;background:var(--line)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12px;padding:3px 8px;border-radius:3px;background:var(--bg);border:1px solid var(--line);color:var(--muted)}
.lock{font-size:11px;font-weight:600;color:var(--muted);white-space:nowrap}
.card[disabled]{opacity:.55;cursor:not-allowed}
.rec{font-size:11px;font-weight:700;color:var(--ink);background:var(--good);padding:2px 6px;border-radius:3px;letter-spacing:.04em;text-transform:uppercase;white-space:nowrap}
.lvl{gap:16px}
.lhead{display:flex;align-items:center;gap:10px}
.lname{flex:1;text-align:center;font-family:var(--display);font-size:clamp(28px,7vw,40px);line-height:1.05;letter-spacing:.02em}
.lname small{display:block;font-family:var(--ui);font-size:13px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;margin-bottom:4px}
.lnav{background:var(--bg);border:1px solid var(--line);border-radius:50%;width:40px;height:40px;font-size:24px;line-height:1;flex:none}
.lnav[disabled]{opacity:.25;cursor:default}
.goals{display:grid;gap:12px}
.goal{display:flex;gap:10px;align-items:flex-start;font-size:clamp(18px,4.6vw,21px);font-weight:600;line-height:1.25}
.goal .st{font-size:1.3em;line-height:1}
.goal small{display:block;font-size:13px;font-weight:500;color:var(--muted);margin-top:2px}
.goal small.rw{color:var(--good)}
.goal.main{font-family:var(--display);font-weight:400;font-size:clamp(24px,6.4vw,32px);letter-spacing:.02em;border-top:1px solid var(--line);padding-top:14px;margin-top:2px}
.miss{margin:0;padding:0;list-style:none;font-size:13px;display:grid;gap:3px}
.miss .supl{color:var(--enemy);font-size:12px;margin-left:20px}
.miss .st{font-size:15px;margin-right:4px}
.watch{display:grid;gap:3px;font-size:12.5px;color:var(--muted);border-left:3px solid var(--enemy);padding:2px 0 2px 10px}
.watch .wh{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--enemy)}
.watch b{color:var(--ink2,#ebe8d5);font-weight:600}
.watch .new{background:var(--enemy);color:#fff;border-radius:3px;padding:0 5px;font-size:10.5px;font-weight:700;text-transform:uppercase}
.miss b{color:var(--accent);font-weight:600}
.stars{color:var(--accent);letter-spacing:2px;font-size:14px}
.pick{display:flex;flex-wrap:wrap;gap:8px}
.opt{background:var(--panel);border:1.5px solid var(--line);border-radius:6px;padding:8px 12px;font-size:14px;text-align:left;display:grid;gap:2px;max-width:100%}
.opt small{color:var(--muted);font-size:12px}
.opt.sel{border-color:var(--accent);background:var(--panel2)}
.opt[disabled]{opacity:.45;cursor:not-allowed}
.deploy{font-family:var(--display);font-size:24px;letter-spacing:.04em;background:var(--accent);color:var(--ink);border:0;border-radius:6px;padding:16px 24px;justify-self:stretch;position:sticky;bottom:12px;z-index:2;box-shadow:0 6px 20px rgba(0,0,0,.5)}
.deploy small{display:block;font-family:var(--ui);font-size:13px;font-weight:600;letter-spacing:0}
.garage{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.grow{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:14px}
.buy{background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:5px 10px;font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap}
.buy:hover:not([disabled]){border-color:var(--accent)}
.buy[disabled]{opacity:.45;cursor:not-allowed}
.pips{color:var(--accent);letter-spacing:1px}
.howto{font-size:13px;color:var(--muted);border-top:1px solid var(--line);padding-top:14px;display:grid;gap:4px}
.howto b{color:var(--fg)}

.mwrap{max-width:560px;gap:14px;padding-bottom:20px;min-height:100%;align-content:start}
.mwrap .deploy{position:sticky;bottom:calc(env(safe-area-inset-bottom,0px) + 12px)}
.deploy[disabled]{opacity:.5;cursor:not-allowed}
.gear{background:var(--panel);border:1px solid var(--line);border-radius:6px;width:42px;height:42px;font-size:22px;line-height:1}
.tshow{gap:12px}
.mwrap .lvl{gap:10px;padding:12px}.mwrap .lname{font-size:clamp(22px,6vw,30px)}.mwrap .goals{gap:8px}
.mwrap .goal{font-size:16px}.mwrap .goal.main{font-size:22px;padding-top:8px}.mwrap .goal small{font-size:12px}
.thead{display:flex;align-items:center;gap:10px}
.tvbox{position:relative;height:min(42vh,340px);margin:0 -14px;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 60%,#3a4430 0%,transparent 70%)}
.tview{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:pan-y;cursor:grab}
.tvl{color:var(--muted);font-size:13px}
.tlock{position:absolute;top:8px;left:50%;transform:translateX(-50%);font-size:12px;font-weight:700;color:var(--ink);background:var(--muted);padding:3px 10px;border-radius:3px;text-transform:uppercase;letter-spacing:.06em;z-index:1}
.dots{display:flex;gap:6px;justify-content:center}.dots i{width:8px;height:8px;border-radius:50%;background:#5d6850}.dots i.on{background:var(--accent)}
.ups{display:grid;gap:8px;border-top:1px solid var(--line);padding-top:12px}
.smodal{position:fixed;inset:0;z-index:40;background:rgba(12,14,9,.82);display:grid;place-items:center;padding:16px}
.sbox{width:min(380px,100%);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px;display:grid;gap:14px;animation:rise .2s ease-out}
.sbox h2{margin:0;font-family:var(--display);font-weight:400;font-size:24px}
.buy.danger{border-color:var(--enemy);color:var(--enemy)}
/* ---------- HUD ---------- */
#hud{position:absolute;inset:0;pointer-events:none;z-index:5}
#xpstrip{position:absolute;top:0;left:0;right:0;padding-top:env(safe-area-inset-top,0px);background:rgba(20,23,15,.88);border-bottom:1px solid var(--line)}
#xpstrip .tr{position:relative;height:16px}
#xpstrip i{position:absolute;inset:0 auto 0 0;background:var(--accent);transition:width .15s}
#xpstrip span{position:absolute;inset:0;display:grid;place-items:center;font-size:10px;font-weight:700;letter-spacing:.08em;text-shadow:0 1px 2px #000}
.left{display:grid;gap:6px;justify-items:start}
.lrow{display:flex;gap:6px;align-items:center}
.hbar{position:absolute;top:0;left:0;right:0;padding-top:calc(env(safe-area-inset-top,0px) + 24px);padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.meter{width:100%;height:14px;background:rgba(20,23,15,.8);border:1px solid var(--line);border-radius:3px;position:relative;overflow:hidden}
.meter i{position:absolute;inset:0 auto 0 0;background:var(--good)}
.meter span{position:absolute;inset:0;font-size:10px;font-weight:700;display:grid;place-items:center;text-shadow:0 1px 2px #000}
#alertm{width:120px}
#alertm i{background:var(--enemy)}
.timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:15px;background:rgba(20,23,15,.78);padding:2px 8px;border-radius:4px;border:1px solid var(--line)}
.hbtn{pointer-events:auto;background:rgba(20,23,15,.85);border:1px solid var(--line);border-radius:4px;padding:5px 10px;font-size:13px;font-weight:600}
#upg{position:absolute;right:max(12px,env(safe-area-inset-right,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 22px);pointer-events:auto;font-family:var(--display);font-size:20px;background:var(--accent);color:var(--ink);border:0;border-radius:6px;padding:12px 22px;letter-spacing:.03em}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
#upg:not([hidden]){animation:pulse 1.1s ease-in-out infinite}
#upg small{display:block;font-family:var(--ui);font-size:12px;font-weight:600;letter-spacing:0}
#toast{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 100px);transform:translateX(-50%);background:rgba(20,23,15,.9);border:1px solid var(--accent);border-radius:6px;padding:8px 14px;font-size:14px;max-width:90%;text-align:center;transition:opacity .3s}
#mini{width:150px;height:115px;border:2px solid rgba(235,232,213,.55);border-radius:6px;background:rgba(20,23,15,.85);box-shadow:0 4px 14px rgba(0,0,0,.5)}
#partsbar{position:absolute;left:max(12px,env(safe-area-inset-left,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 12px);display:flex;flex-wrap:wrap;gap:4px;max-width:55%}
#partsbar span{font-size:11px;background:rgba(20,23,15,.8);border:1px solid var(--line);border-radius:3px;padding:2px 6px}

/* ---------- overlays ---------- */
.ov{position:absolute;inset:0;background:rgba(12,14,9,.82);z-index:30;display:grid;place-items:center;overflow-y:auto;touch-action:pan-y;padding-block:20px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.ovbox{width:min(760px,100%);display:grid;gap:14px;justify-items:center;text-align:center}
.ovbox h2{margin:0;font-family:var(--display);font-weight:400;font-size:clamp(24px,5vw,34px);letter-spacing:.03em;text-wrap:balance}
.ovbox p{margin:0;color:var(--muted);max-width:60ch}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;width:100%}
.pcard{background:var(--panel);border:1.5px solid var(--line);border-radius:8px;padding:14px;display:grid;gap:6px;text-align:left;align-content:start}
.pcard:hover{border-color:var(--accent)}
.pcard .slot{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.pcard .nm{font-size:19px;font-weight:700}
.pcard .lv{font-size:12px;color:var(--accent);font-weight:700}
.pcard .d{font-size:13px;color:var(--fg);opacity:.85}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.btn{background:var(--panel);border:1.5px solid var(--line);border-radius:6px;padding:10px 16px;font-size:15px;font-weight:600}
.btn.pri{background:var(--accent);color:var(--ink);border-color:var(--accent)}
.debrief{width:100%;display:grid;gap:8px;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px}
.debrief .ln{display:flex;justify-content:space-between;gap:10px;font-size:14px;font-variant-numeric:tabular-nums}
.debrief .lost{color:var(--muted);font-size:13px}
.debrief .lost s{color:var(--enemy)}
/* micro-animations */
button{transition:transform .12s ease,border-color .15s,background-color .15s,box-shadow .15s}
button:active:not([disabled]){transform:scale(.96)}
.card:not([disabled]):hover,.node:not([disabled]):hover,.opt:not([disabled]):hover{border-color:#6b7556}
.card.sel:hover,.node.sel:hover,.opt.sel:hover{border-color:var(--accent)}
@keyframes rise{from{opacity:0;transform:translateY(14px) scale(.97)}to{opacity:1;transform:none}}
@keyframes popin{0%{opacity:0;transform:scale(.4)}65%{opacity:1;transform:scale(1.15)}100%{transform:scale(1)}}
@keyframes toastin{from{opacity:0;transform:translate(-50%,12px)}to{opacity:1;transform:translate(-50%,0)}}
@keyframes glow{0%{filter:brightness(1.8)}100%{filter:none}}
.enter .step,.enter .top{animation:rise .4s ease-out both}
.enter .step:nth-of-type(2){animation-delay:.06s}.enter .step:nth-of-type(3){animation-delay:.12s}
.ovbox{animation:rise .25s ease-out}
.pcard{animation:rise .32s ease-out both}.pcard:nth-child(2){animation-delay:.07s}.pcard:nth-child(3){animation-delay:.14s}
.pcard:hover{transform:translateY(-3px)}
.dstar{display:inline-block;animation:popin .45s ease-out both}
#toast.in{animation:toastin .25s ease-out}
#upg:not([hidden]){animation:popin .35s ease-out,pulse 1.1s ease-in-out .35s infinite}
#xpstrip.glow i{animation:glow .3s ease-out}
.opts{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>

<div id="phone">
<canvas id="gl"></canvas>
<canvas id="cv"></canvas>
<div id="ld">Loading 3D models</div>

<div id="hud" hidden>
  <div id="xpstrip"><div class="tr"><i id="xpfill"></i><span id="xptext"></span></div></div>
  <div class="hbar">
    <div class="left">
      <div class="lrow"><button class="hbtn" id="pausebtn" aria-label="Pause">II</button><button class="hbtn" id="sndbtn" aria-label="Sound on or off">♪</button><div class="timer" id="timer">0:00</div></div>
      <div class="meter" id="alertm"><i></i><span></span></div>
    </div>
    <canvas id="mini"></canvas>
  </div>
  <div id="toast" hidden></div>
  <div id="partsbar"></div>
  <button id="upg" hidden>Upgrade<small id="upgn"></small></button>
</div>

<div id="menu"></div>
<div class="ov" id="ov" hidden><div class="ovbox" id="ovbox"></div></div>
</div>

<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
(()=>{
// ================= helpers =================
const $=s=>document.querySelector(s);
const rand=(a,b)=>a+Math.random()*(b-a);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const adiff=(a,b)=>Math.atan2(Math.sin(b-a),Math.cos(b-a));
const hyp=Math.hypot, PI=Math.PI;
function mulberry(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function segCirc(x1,y1,x2,y2,cx,cy,r){const dx=x2-x1,dy=y2-y1,l=dx*dx+dy*dy;let t=l?((cx-x1)*dx+(cy-y1)*dy)/l:0;t=clamp(t,0,1);const px=x1+dx*t-cx,py=y1+dy*t-cy;return px*px+py*py<r*r}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

// ================= data =================
const TANKS={
  scout:{name:'Scout',tag:'Fast, thin armor, quick turret',hp:80,speed:215,turn:4.4,dmg:16,reload:.42,turret:6,range:320,crush:1,ric:.15,size:15,front:.6,smallFront:.3,col:'#a9ba6c',col2:'#7f8f4c',
    bars:{Speed:95,Armor:25,Firepower:35,'Crush class':25},crushTxt:'Crushes infantry and fences'},
  brawler:{name:'Brawler',tag:'Balanced all-rounder',hp:135,speed:150,turn:3.3,dmg:30,reload:.9,turret:3.2,range:360,crush:2,ric:.35,size:19,front:.45,smallFront:0,col:'#8f9d5c',col2:'#66733f',
    bars:{Speed:60,Armor:55,Firepower:60,'Crush class':55},crushTxt:'Also crushes MG nests and AT guns',price:150},
  heavy:{name:'Heavy',tag:'Slow, thick front, big gun',hp:215,speed:100,turn:2.4,dmg:60,reload:1.55,turret:1.7,range:410,crush:3,ric:.55,size:24,front:.3,smallFront:0,col:'#717f4c',col2:'#4f5a33',
    bars:{Speed:30,Armor:95,Firepower:95,'Crush class':90},crushTxt:'Also crushes huts and cars',price:320},
};
const PARTS={
  coax:{name:'Coax MG',slot:'Main gun',d:l=>`Auto MG that shreds infantry. ${6+3*(l-1)} rounds/s.`},
  ap:{name:'AP shells',slot:'Main gun',d:l=>`+${25*l}% damage to armor. Ignores enemy front armor.`},
  he:{name:'HE shells',slot:'Main gun',d:l=>`Shells splash ${40+15*l} m for half damage. Great on groups.`,bp:1},
  loader:{name:'Fast loader',slot:'Main gun',d:l=>`Reload ${Math.round((1-Math.pow(.84,l))*100)}% faster.`},

  plate:{name:'Extra plate',slot:'Front',d:l=>`+30 max HP, repairs 30. Front armor +10%.`},
  dozer:{name:'Dozer blade',slot:'Front',d:l=>`Crush one class heavier. Ram damage ${40*l}/s.`,bp:1},
  skirts:{name:'Side skirts',slot:'Sides',d:l=>`Side hits deal ${22*l}% less.`,bp:1},
  rearmg:{name:'Rear MG',slot:'Rear',d:l=>`Covers your back. ${4+2*(l-1)} rounds/s.`},
  roofmortar:{name:'Roof mortar',slot:'Roof',d:l=>`Lobs a shell over cover every ${(3.4/(1+.35*(l-1))).toFixed(1)} s.`,bp:1},
  engine:{name:'Engine',slot:'Stat',d:l=>`+12% speed.`},
  repair:{name:'Repair crew',slot:'Stat',d:l=>`Repair ${1.5*l} HP/s.`},
};

function threatOf(L){const c={};const add=o=>{for(const[t,n]of Object.entries(o||{}))c[t]=(c[t]||0)+n};[L.light,L.medium,L.heavy,L.roam].forEach(add);L.obj.forEach(o=>(o.units||[]).forEach(t=>c[t]=(c[t]||0)+1));
  const g=t=>c[t]||0,sc=v=>Math.round(clamp(v,4,100));
  const sp=k=>L.obj.filter(o=>o.sup===k).length;const out={Infantry:sc(g('inf')*1.3+sp('infantry')*15),Armor:sc(g('tank')*11+g('leader')*18+g('flame')*14+g('car')*4+sp('tanks')*25+sp('cars')*12),Artillery:sc(g('mortar')*11+g('rocket')*14+sp('artillery')*25),'AT weapons':sc(g('at')*4+g('atgun')*10+g('bombcar')*5)};if(sp('air')||L.raid)out.Air=sc((sp('air')?50:0)+(L.raid?1500/L.raid:0));return out}
function watchOf(L){const c=new Set(L.wave);[L.light,L.medium,L.heavy,L.roam].forEach(o=>Object.keys(o||{}).forEach(t=>c.add(t)));L.obj.forEach(o=>(o.units||[]).forEach(t=>c.add(t)));
  const out=Object.keys(WATCH).filter(k=>k==='mines'?L.mines:k==='air'?(L.raid||L.obj.some(o=>o.sup==='air')):c.has(k));return out}

  const fl=new THREE.Mesh(new THREE.CircleGeometry(48,48),new THREE.ShadowMaterial({opacity:.45}));fl.rotation.x=-PI/2;fl.receiveShadow=true;tv.scene.add(fl);

  const al=$('#alertm');al.firstElementChild.style.width=Math.min(100,G.alert)+'%';al.lastElementChild.textContent=`ALERT ${Math.floor(Math.min(100,G.alert))}`;
  const t=Math.floor(G.time);$('#timer').textContent=`${Math.floor(t/60)}:${String(t%60).padStart(2,'0')}`;
}

// ================= loop =================
let last=performance.now();
function frame(now){const dt=Math.min(.033,(now-last)/1000);last=now;
  if(G&&!G.paused&&!G.over){let d2=dt;if(G.slow>0){G.slow-=dt;d2*=.3}update(d2)}else SFX.engine(false);
  draw();if(G){hud();drawMini()}
  requestAnimationFrame(frame)}
menu.classList.add('enter');renderMenu();modelsP.then(()=>{if(!menu.hidden)renderMenu()});requestAnimationFrame(frame);
})();
</script>
